name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    - name: Build Solution
      run: dotnet build -c Release

    - name: Archive Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error
        retention-days: 1
