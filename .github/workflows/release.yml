name: Create Release

on:
  workflow_dispatch:

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.read.outputs.name }}
      version: ${{ steps.read.outputs.version }}
    env:
      DOTNET_NOLOGO: true
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Read Mod Metadata
      id: read
      run: |
        props=$(dotnet msbuild Directory.Build.props -getProperty:ModFolder -getProperty:Version)
        name=$(jq -r .Properties.ModFolder <<< "$props")
        version=$(jq -r .Properties.Version <<< "$props")
        if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
          echo "::error::Tag v$version already exists - bump <Version> in Directory.Build.props"
          exit 1
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    uses: ./.github/workflows/build.yml

  release:
    runs-on: ubuntu-latest
    needs: [ metadata, build ]
    permissions:
      contents: write
    env:
      TAG: v${{ needs.metadata.outputs.version }}
      ZIP_NAME: ${{ needs.metadata.outputs.name }}-v${{ needs.metadata.outputs.version }}.zip

    steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist

    - name: Create Release Zip
      run: cd dist && zip -r "../$ZIP_NAME" .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.TAG }}
        name: ${{ env.TAG }}
        files: ${{ env.ZIP_NAME }}
        make_latest: true
